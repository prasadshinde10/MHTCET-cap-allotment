name: Build Windows Desktop Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach the desktop release to (e.g. v1.4.1)'
        required: true
        default: 'v1.4.1'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend (Vite)
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r backend/requirements.txt
          pip install --prefer-binary pyinstaller

      - name: Build Windows Executable
        run: |
          pyinstaller --clean CAP_Portal.spec

      - name: Determine Target Release Tag
        id: get_tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "TAG=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG=v1.4.1" >> $GITHUB_OUTPUT
          fi

      - name: Package Desktop Release (.zip)
        shell: pwsh
        run: |
          $tag = "${{ steps.get_tag.outputs.TAG }}"
          $zipVersioned = "MHTCET-cap-allotment-$tag.zip"
          $zipStandard = "MHTCET-cap-allotment.zip"
          
          # Compress dist/CAP_Portal folder into release zip
          Compress-Archive -Path dist/CAP_Portal/* -DestinationPath $zipVersioned -Force
          Copy-Item -Path $zipVersioned -Destination $zipStandard -Force

          echo "ZIP_VERSIONED=$zipVersioned" >> $env:GITHUB_ENV
          echo "ZIP_STANDARD=$zipStandard" >> $env:GITHUB_ENV
          Get-ChildItem -Path *.zip | Select-Object Name, Length

      - name: Upload Desktop Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.get_tag.outputs.TAG }}
          files: |
            ${{ env.ZIP_VERSIONED }}
            ${{ env.ZIP_STANDARD }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
